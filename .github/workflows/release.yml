name: CI & Auto-Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate JavaScript Syntax
        run: |
          FILE="readd-gmaps-links.user.js"
          if [ ! -f "$FILE" ]; then
            echo "ERROR: $FILE not found"
            exit 1
          fi
          echo "Checking JavaScript syntax..."
          node --check "$FILE"
          echo "  OK: JavaScript syntax is valid"

      - name: Validate Userscript Header Metadata
        run: |
          FILE="readd-gmaps-links.user.js"
          echo "Checking required metadata fields..."
          for field in "@name" "@namespace" "@version" "@description" "@match" "@grant" "@run-at"; do
            if ! grep -q "$field" "$FILE"; then
              echo "ERROR: Missing required field: $field"
              exit 1
            fi
            echo "  OK: $field"
          done

  release:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Determine & Bump Version
        id: versioning
        run: node .github/scripts/bump-version.js

      - name: Commit version bump back to main
        if: steps.versioning.outputs.was_bumped == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add readd-gmaps-links.user.js
          git commit -m "chore(release): bump version to v${{ steps.versioning.outputs.version }} [skip ci]"
          git push

      - name: Create Git Tag
        run: |
          TAG="v${{ steps.versioning.outputs.version }}"
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.versioning.outputs.version }}"
          name: "v${{ steps.versioning.outputs.version }}"
          files: |
            readd-gmaps-links.user.js
            assets/icon.png
          generate_release_notes: true
          fail_on_unmatched_files: true
