name: CI & Release Userscript

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate JavaScript Syntax
        run: |
          FILE="readd-gmaps-links.user.js"
          if [ ! -f "$FILE" ]; then
            echo "ERROR: $FILE not found"
            exit 1
          fi
          echo "Checking JavaScript syntax..."
          node --check "$FILE"
          echo "  OK: JavaScript syntax is valid"

      - name: Validate Userscript Header Metadata
        run: |
          FILE="readd-gmaps-links.user.js"
          echo "Checking required metadata fields..."
          for field in "@name" "@namespace" "@version" "@description" "@match" "@grant" "@run-at"; do
            if ! grep -q "$field" "$FILE"; then
              echo "ERROR: Missing required field: $field"
              exit 1
            fi
            echo "  OK: $field"
          done

      - name: Validate @version matches tag (on release tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          FILE="readd-gmaps-links.user.js"
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          SCRIPT_VERSION=$(grep '@version' "$FILE" | head -1 | sed 's/.*@version[[:space:]]*//' | tr -d '[:space:]')
          if [ "$TAG_VERSION" != "$SCRIPT_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) does not match script version ($SCRIPT_VERSION)"
            exit 1
          fi
          echo "  OK: version $SCRIPT_VERSION matches tag"

  build:
    runs-on: ubuntu-latest
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: readd-gmaps-links-user-js
          path: readd-gmaps-links.user.js

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: readd-gmaps-links-user-js

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            readd-gmaps-links.user.js
            assets/icon.png
          generate_release_notes: true
          fail_on_unmatched_files: true
